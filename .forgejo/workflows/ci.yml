name: Build, test and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: chatvault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify_changes:
    name: Classify changes
    runs-on: linux-amd64
    outputs:
      requires_build: ${{ steps.changes.outputs.requires_build }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject local agent files
        run: |
          set -euo pipefail
          if git ls-files | grep -Eiq '(^|/)(agents|memory)\.md$'; then
            echo 'Tracked AGENTS.md or MEMORY.md is not allowed.' >&2
            exit 1
          fi

      - name: Detect build-relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'Manual run: full build required.'
            echo 'requires_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [ -z "$base" ] ||
             printf '%s' "$base" | grep -Eq '^0+$' ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null ||
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo 'The complete comparison range is unavailable: full build required.'
            echo 'requires_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$base" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo 'No changed files detected: full build required.'
            echo 'requires_build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          requires_build=false
          for path in "${changed_files[@]}"; do
            case "$path" in
              *.md|*.mdx|LICENSE|LICENSE.*|docs/*)
                ;;
              *)
                requires_build=true
                break
                ;;
            esac
          done

          echo "requires_build=$requires_build" >> "$GITHUB_OUTPUT"
          if [ "$requires_build" = "true" ]; then
            echo 'Build-relevant changes detected.'
          else
            echo 'Documentation-only change: build and tests will be skipped.'
          fi

  build_and_test:
    name: Build and test
    needs: classify_changes
    if: needs.classify_changes.outputs.requires_build == 'true'
    runs-on: linux-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Setup Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend
        run: npm ci

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --skip indexes_and_reads_real_chats

      - name: Production build
        run: npx tauri build --no-bundle --ci

  deploy_github:
    name: Deploy to GitHub
    needs:
      - classify_changes
      - build_and_test
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.classify_changes.result == 'success' &&
      (needs.build_and_test.result == 'success' || needs.build_and_test.result == 'skipped')
    runs-on: linux-amd64

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch complete history
        run: |
          set -euo pipefail
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --unshallow origin || true

      - name: Configure GitHub SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H -t ed25519 github.com > "$HOME/.ssh/known_hosts"
          chmod 0644 "$HOME/.ssh/known_hosts"

      - name: Mirror branches and tags to GitHub
        env:
          GIT_SSH_COMMAND: ssh -o IdentitiesOnly=yes -o BatchMode=yes
        run: |
          set -euo pipefail
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | while read -r b; do
            case "$b" in HEAD|main) continue ;; esac
            git branch -f "$b" "origin/$b"
          done
          tmp=$(mktemp -d)
          git clone --bare "$PWD" "$tmp/chatvault.git"
          git -C "$tmp/chatvault.git" for-each-ref --format='%(refname)' refs/remotes | while read -r r; do
            git -C "$tmp/chatvault.git" update-ref -d "$r"
          done
          git -C "$tmp/chatvault.git" remote remove origin || true
          git -C "$tmp/chatvault.git" remote add github git@github.com:spalencsar/chatvault.git
          git -C "$tmp/chatvault.git" push --mirror github
